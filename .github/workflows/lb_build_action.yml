#############################################################################
#  GitHub Action to perform a build on the first database, eg. DEV,
#  using Liquibase Secure, Flows, Policy checks, and S3.
##############################################################################
name: 'Liquibase Build Job'
run-name: ${{ inputs.environment}} build of current repo by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:
    
      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment for build'
        type: environment
        required: true
        default: DEV
        
      lb_tag:
        description: 'Optional tag for the build'
        type: string
        required: false


####################################################################
### Include permissions for OIDC
#####################################################################
permissions:
  id-token: write
  contents: write # If not writing back to the repo set to read

####################################################################
#  Set up the environment
#####################################################################
env:

  # Liquibase Platform Settings
  LIQUIBASE_PLATFORM_ENABLED: true
  LIQUIBASE_PLATFORM_API_URL: https://cs-ci.liquibase.net/api/operations/ingest
  LIQUIBASE_PLATFORM_API_KEY: ${{ secrets.LIQUIBASE_PLATFORM_API_KEY }}
  LIQUIBASE_PLATFORM_CONNECTION_IDENTIFIER: ${{ vars.LIQUIBASE_PLATFORM_CONNECTION_IDENTIFIER }}
  LIQUIBASE_PLATFORM_CHANGELOG_IDENTIFIER: ${{ vars.LIQUIBASE_PLATFORM_CHANGELOG_IDENTIFIER }}

  # Liquibase License Tracking Settings (also needs PLATFORM_API_KEY from above)
  LIQUIBASE_LICENSE_TRACKING_ENABLED: true
  LIQUIBASE_LICENSE_ENDPOINT_URL: https://cs-ci.liquibase.net/api/licenses/access
  # Optional fallback if the endpoint is unreachable:
  # LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}

  # AWS S3 bucket is the host part of the S3 bucket
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  
  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ secrets.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: gha
  
  # Default schema: Specify schema for all changes
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: gha
  LIQUIBASE_COMMAND_REFERENCE_DEFAULT_SCHEMA_NAME: gha

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: flows, checks, changelogs, s3://${{ vars.AWS_S3_BUCKET }}/sensitive_pii_data
  
  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.yaml
  
  # Environment, Branch, and Tag information
  ENVIRONMENT: ${{ inputs.environment }}
  BRANCH: ${{ github.ref_name }}
  LB_TAG: ${{ github.event.inputs.lb_tag || github.ref_name }}

  # Reports
  LIQUIBASE_REPORT_PATH: reports
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json
  
  # PSQL values
  LIQUIBASE_PSQL_KEEP_TEMP_PATH: reports
  LIQUIBASE_PSQL_LOG_FILE: output.log
  
  # DBCL / History Settings
  LIQUIBASE_DBCLHISTORY_ENABLED: true
  LB_HISTORY_COUNT: 50

  # Checks Settings
  LIQUIBASE_COMMAND_CHECKS_RUN_AUTO_UPDATE: off
  LIQUIBASE_COMMAND_CHECKS_RUN_CHECKS_SCRIPTS_ENABLED: true
  LIQUIBASE_COMMAND_CHECKS_RUN_ASSIGNMENT_ID: ${{ vars.LIQUIBASE_COMMAND_CHECKS_ASSIGNMENT_ID }}
  LIQUIBASE_COMMAND_CHECKS_SHOW_ASSIGNMENT_ID: ${{ vars.LIQUIBASE_COMMAND_CHECKS_ASSIGNMENT_ID }}

jobs:
  #########################################################################
  #  Build
  #########################################################################

  database-build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

###
### Retrieve AWS credentials
### Requires an AWS IAM role with token.actions.githubusercontent.com web identity provider
### Provider URL: https://token.actions.githubusercontent.com
### Audience: sts.amazonaws.com
### Need to grab the license key to install paid version
###
    - name: Retrieving AWS credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
      with:
        ca-cert-path: certs/cs-ci-ca.cer

    - name: Liquibase Build Flow
      run: liquibase flow --flow-file=liquibase-build.flowfile.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Auto-generated

    - name: Upload Reports Artifact
      if: always()
      uses: ./.github/workflows/upload-reports
      with:
        job-type: deploy
        upload-s3: true
